name: Build addon
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NDK_VERSION: 28.1.13356709

jobs:
  desktop:
    name: ${{ matrix.platform }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, arch: x86_64, target: template_debug }
          - { os: ubuntu-22.04, platform: linux, arch: x86_64, target: template_release }
          - { os: windows-latest, platform: windows, arch: x86_64, target: template_debug }
          - { os: windows-latest, platform: windows, arch: x86_64, target: template_release }
          - { os: macos-latest, platform: macos, arch: universal, target: template_debug }
          - { os: macos-latest, platform: macos, arch: universal, target: template_release }
          - { os: macos-latest, platform: ios, arch: arm64, target: template_debug }
          - { os: macos-latest, platform: ios, arch: arm64, target: template_release }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/build-gdextension
        with:
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          artifact: ${{ matrix.platform }}.${{ matrix.target }}.${{ matrix.arch }}
          additional: lto=full

  android:
    name: android ${{ matrix.arch }} ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm32, arm64, x86_32, x86_64]
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Locate Android SDK
        id: android-sdk
        run: echo "path=${ANDROID_HOME}" >> "$GITHUB_OUTPUT"
      - name: Install Android NDK
        run: echo y | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
      - uses: ./.github/actions/build-gdextension
        env:
          ANDROID_NDK_ROOT: ${{ steps.android-sdk.outputs.path }}/ndk/${{ env.NDK_VERSION }}
        with:
          platform: android
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          artifact: android.${{ matrix.target }}.${{ matrix.arch }}
          additional: lto=full

  web:
    name: web ${{ matrix.target }} threads=${{ matrix.threads }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        threads: [yes, no]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pyodide/setup-emsdk@v15
        with:
          version: 3.1.64
          actions-cache-folder: .emsdk-cache
      - uses: ./.github/actions/build-gdextension
        with:
          platform: web
          target: ${{ matrix.target }}
          arch: wasm32
          artifact: web.${{ matrix.target }}.threads_${{ matrix.threads }}
          additional: lto=full threads=${{ matrix.threads }}

  package:
    name: Package Asset Library addon
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: addons/ogg_opus/bin
          merge-multiple: true
      - name: Verify and package
        run: |
          find addons/ogg_opus/bin -type f -print | sort
          test "$(find addons/ogg_opus/bin -type f | wc -l)" -ge 20
          mkdir -p dist
          zip -r dist/godot-ogg-opus.zip addons/ogg_opus
      - uses: actions/upload-artifact@v4
        with:
          name: godot-ogg-opus
          path: dist/godot-ogg-opus.zip
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/godot-ogg-opus.zip --generate-notes
