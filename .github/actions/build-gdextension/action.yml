name: Build GDExtension
description: Build one Xiph Audio for Godot platform/target combination
inputs:
  platform: { description: Target platform, required: true }
  target: { description: Godot build target, required: true }
  arch: { description: Target architecture, required: true }
  artifact: { description: Uploaded artifact name, required: true }
  additional: { description: Additional SCons options, required: false, default: "" }
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install SCons
      shell: bash
      run: python -m pip install scons
    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .scons-cache
        key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.target }}-${{ hashFiles('SConstruct', 'tools/scons_helpers.py', '.gitmodules') }}
    - name: Build codecs and extension
      shell: bash
      env:
        SCONS_CACHE: ${{ github.workspace }}/.scons-cache
      run: |
        params="platform=${{ inputs.platform }} target=${{ inputs.target }} arch=${{ inputs.arch }} ${{ inputs.additional }}"
        scons build_ogg $params
        scons build_opus $params
        scons build_flac $params
        scons $params
    - name: Verify bundled Linux dependencies
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        file addons/xiph_audio/bin/*.so
        if readelf -d addons/xiph_audio/bin/*.so | grep NEEDED | grep -E 'lib(FLAC|opus|ogg)'; then
          echo 'A Xiph dependency was linked dynamically' >&2
          exit 1
        fi
    - name: Remove non-runtime Windows files
      if: runner.os == 'Windows'
      shell: powershell
      run: Remove-Item addons/xiph_audio/bin/* -Recurse -Include *.exp,*.lib,*.pdb -Force
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: addons/xiph_audio/bin/*
        if-no-files-found: error
        retention-days: 7
